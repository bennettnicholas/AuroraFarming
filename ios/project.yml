# XcodeGen spec. Generate the project with `./bootstrap.sh` (or `xcodegen generate`
# after `./build-core.sh`). The .xcodeproj is not committed.
name: Aurora
options:
  bundleIdPrefix: com.aurorafarming
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - path: Aurora
      - path: Generated/aurora_core.swift
    dependencies:
      # Built by build-core.sh: the Rust core for device + simulator.
      - framework: AuroraCore.xcframework
        embed: false
      - sdk: libsqlite3.tbd
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorafarming.aurora
        PRODUCT_NAME: Aurora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Aurora/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSBluetoothAlwaysUsageDescription: Aurora connects to your Oura Ring over Bluetooth to download your health data directly to this iPhone.
        UIBackgroundModes: [bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.aurorafarming.aurora.sync]
        # Ring auth uses AES only for authentication: exempt.
        ITSAppUsesNonExemptEncryption: false
  AuroraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AuroraTests]
    dependencies:
      - target: Aurora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorafarming.aurora.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Aurora:
    build:
      targets:
        Aurora: all
        AuroraTests: [test]
    test:
      targets: [AuroraTests]
